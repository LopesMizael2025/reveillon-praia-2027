<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réveillon Praia 2027 — Mapa de Mesas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1020; --panel: rgba(12, 18, 36, .92); --line: rgba(212, 175, 55, .28);
    --gold: #d4af37; --gold-2: #f3dd8a; --text: #f4f1e8; --muted: #a9aec0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: Montserrat, system-ui, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  aside {
    position: fixed; top: 16px; left: 16px; bottom: 16px; width: 300px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
    backdrop-filter: blur(8px);
  }
  h1 { font-size: 13px; letter-spacing: .22em; color: var(--gold); margin: 0 0 2px; font-weight: 600; }
  h2 { font-size: 26px; margin: 0 0 4px; font-weight: 800; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .sec-title { font-size: 11px; letter-spacing: .18em; color: var(--gold); margin: 18px 0 8px; font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stat { background: rgba(255,255,255,.04); border-radius: 8px; padding: 8px 6px; text-align: center; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .legend { list-style: none; padding: 0; margin: 0; }
  .legend li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px;
    cursor: pointer; font-size: 13px; }
  .legend li:hover, .legend li.on { background: rgba(255,255,255,.07); }
  .legend i { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .legend small { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button, input {
    font: inherit; font-size: 12px; color: var(--text); background: rgba(255,255,255,.06);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--gold); }
  button.primary { background: var(--gold); color: #1a1406; border-color: var(--gold); font-weight: 600; }
  input { cursor: text; flex: 1; min-width: 0; }
  label.chk { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 8px; cursor: pointer; }
  label.chk input { flex: none; }
  #info {
    position: fixed; right: 16px; bottom: 16px; width: 280px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: none;
  }
  #info .num { font-size: 40px; font-weight: 800; line-height: 1; }
  #info .meta { color: var(--muted); font-size: 12px; margin: 6px 0 12px; }
  #info .status-btns button.sel { outline: 2px solid var(--gold); }
  #hint { position: fixed; right: 16px; top: 16px; font-size: 11px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  @media (max-width: 720px) {
    aside { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 42vh; border-radius: 14px 14px 0 0; }
    #info { left: 16px; right: 16px; width: auto; bottom: calc(42vh + 12px); }
    #hint { display: none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="app"></div>

<aside>
  <h1>PRAIA HALL · PRAIA CLUBE</h1>
  <h2>Réveillon 2027</h2>
  <div class="sub">Mapa de mesas para venda · projeto Leo Bione</div>

  <div class="stats">
    <div class="stat"><b id="sDisp">–</b><span>Livres</span></div>
    <div class="stat"><b id="sRes">–</b><span>Reserv.</span></div>
    <div class="stat"><b id="sVend">–</b><span>Vendidas</span></div>
  </div>
  <div class="sub" id="sLug" style="margin-top:8px"></div>

  <div class="sec-title">BUSCAR</div>
  <div class="row">
    <input id="q" placeholder="Mesa 57, L3, P2…">
    <button class="primary" id="go">Ir</button>
  </div>

  <div class="sec-title">SETORES</div>
  <ul class="legend" id="legend"></ul>

  <div class="row">

    <button data-view="stage">Do palco</button>
    <button data-view="entry">Da entrada</button>

  <label class="chk"><input type="checkbox" id="tLabels" checked> Mostrar números</label>
  <label class="chk"><input type="checkbox" id="tFree"> Destacar só as livres</label>

  <div class="sec-title">EXPORTAR</div>
  <div class="row">
    <button id="ePlan">Planta numerada (PNG)</button>
    <button id="eView">Vista atual (PNG)</button>
    <button id="eCsv">Lista (CSV)</button>
  </div>
  <div class="sub" style="margin-top:10px">O status das mesas fica salvo neste navegador.</div>
  <div class="row"><button id="reset">Zerar status</button></div>
</aside>

<div id="hint">Arraste para girar · botão direito move · roda aproxima · clique numa mesa</div>

<div id="info">
  <div class="num" id="iNum"></div>

    <button data-st="vendida">Vendida</button>
  </div>
</div>

function slab(px0, py0, px1, py1, h, mat, y0 = 0, cast = true) {
  const [x0, z0] = W(px0, py0), [x1, z1] = W(px1, py1);
  const m = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x1 - x0), h, Math.abs(z1 - z0)), mat);
  m.position.set((x0 + x1) / 2, y0 + h / 2, (z0 + z1) / 2);
  m.castShadow = cast; m.receiveShadow = true;
  scene.add(m);
  return m;
}

function textTexture(lines, { w = 1024, h = 256, color = '#d4af37', bg = null, font = 800, size = 140 } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
  g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
  const arr = Array.isArray(lines) ? lines : [lines];
  arr.forEach((ln, i) => {
    const sz = typeof ln === 'object' ? ln.size : size;
    const t = typeof ln === 'object' ? ln.t : ln;
    let fs = sz;
    g.font = `${font} ${fs}px Montserrat, sans-serif`;
    while (g.measureText(t).width > w * 0.94 && fs > 10) { fs -= 4; g.font = `${font} ${fs}px Montserrat, sans-serif`; }
    g.fillText(t, w / 2, h * (i + 0.5) / arr.length);
  });
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  return tex;
}

function floorText(txt, px, py, width, color = '#d4af37', rot = 0, y = 0.07) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(width, width / 4),

  const [x, z] = W(px, py);
  m.rotation.set(-Math.PI / 2, 0, rot);
  m.position.set(x, y, z);

function prism(ptsPx, y0, y1, mats) {
  const sh = new THREE.Shape(ptsPx.map(([px, py]) => { const [x, z] = W(px, py); return new THREE.Vector2(x, -z); }));

  const m = new THREE.Mesh(geo, mats); m.receiveShadow = true; m.castShadow = true;
  scene.add(m);
  return m;

$('q').onkeydown = e => { if (e.key === 'Enter') findAndGo(); };

$('reset').onclick = () => {
  if (!confirm('Zerar o status de todas as mesas neste navegador?')) return;
  status = {}; saveStatus(); refreshAll(); select(null);
};

$('eCsv').onclick = () => {
  const rows = [['id', 'tipo', 'setor', 'lugares', 'status']];
  items.forEach(it => rows.push([it.label, it.tipo, SECTORS[it.sector].nome, it.lugares, stOf(it)]));
  download(new Blob(['﻿' + rows.map(r => r.join(';')).join('\n')], { type: 'text/csv' }), 'reveillon2027_mesas.csv');
};
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ---------- câmera ----------
const VIEWS = {
  iso:   { t: [0, 0, 2],  p: [-38, 52, 58] },
  top:   { t: [0, 0, 0],  p: [0, 105, 0.01] },
  stage: { t: [0, 0, 5],  p: [-2, 14, -30] },
  entry: { t: [-2, 0, 14], p: [-16, 8, 46] },
};
let anim = null;
function flyTo(target, pos, ms = 900) {
  anim = { t0: performance.now(), ms, ft: controls.target.clone(), fp: camera.position.clone(), tt: target, tp: pos };
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
  const v = VIEWS[b.dataset.view];
  flyTo(new THREE.Vector3(...v.t), new THREE.Vector3(...v.p));
});
camera.position.set(...VIEWS.iso.p); controls.target.set(...VIEWS.iso.t);

// ---------- seleção por clique ----------
const pulseRing = new THREE.Mesh(new THREE.RingGeometry(1.2, 1.45, 48), new THREE.MeshBasicMaterial({ color: '#f3dd8a', transparent: true }));
pulseRing.rotation.x = -Math.PI / 2; pulseRing.visible = false; scene.add(pulseRing);

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const pick = [labelGroup.visible ? labelGroup : null, tablesMesh, ...Object.values(loungeGroups)].filter(Boolean);
  const hit = ray.intersectObjects(pick, true)[0];
  if (!hit) { select(null); return; }
  if (hit.object === tablesMesh) select(tablesOnly[hit.instanceId]);
  else select(byId[(hit.object.userData.itemId || '').toUpperCase()] || null);
});

// ---------- exportações PNG ----------
function renderToCanvas(cam, w, h) {
  const prevSize = renderer.getSize(new THREE.Vector2()), prevPR = renderer.getPixelRatio();
  renderer.setPixelRatio(1); renderer.setSize(w, h, false);
  renderer.render(scene, cam);
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  out.getContext('2d').drawImage(renderer.domElement, 0, 0);
  renderer.setPixelRatio(prevPR); renderer.setSize(prevSize.x, prevSize.y);
  return out;
}
function buildPlanCanvas(ppm = 90) {
  const [x0, z0] = W(80, 140), [x1, z1] = W(1250, 1945);
  const w = Math.round((x1 - x0) * ppm), h = Math.round((z1 - z0) * ppm);
  const cam = new THREE.OrthographicCamera(x0, x1, -z0, -z1, 1, 200);
  cam.position.set(0, 100, 0); cam.up.set(0, 0, -1); cam.lookAt(0, 0, 0);
  const prevFog = scene.fog, prevVis = labelGroup.visible, prevPulse = pulseRing.visible;
  scene.fog = null; labelGroup.visible = true; pulseRing.visible = false;
  const img = renderToCanvas(cam, w, h);
  scene.fog = prevFog; labelGroup.visible = prevVis; pulseRing.visible = prevPulse;
  const k = ppm / 90, head = 420 * k, foot = 380 * k;
  const c = document.createElement('canvas'); c.width = w; c.height = Math.round(h + head + foot);
  const g = c.getContext('2d');
  g.fillStyle = '#0b1020'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, head);
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = '#d4af37'; g.font = `600 ${54 * k}px Montserrat`; g.fillText('PRAIA HALL · PRAIA CLUBE', 110 * k, 140 * k);
  g.fillStyle = '#f4f1e8'; g.font = `800 ${150 * k}px Montserrat`; g.fillText('Réveillon 2027', 100 * k, 300 * k);
  g.fillStyle = '#a9aec0'; g.font = `400 ${46 * k}px Montserrat`;
  g.fillText('Mapa de mesas · 200 mesas de 4 lugares + 16 lounges de 5 lugares · 880 lugares', 110 * k, 380 * k);
  let lx = 110 * k, ly = head + h + 130 * k;
  g.font = `600 ${44 * k}px Montserrat`;
  Object.entries(SECTORS).forEach(([key, s], i) => {
    if (i === 4) { lx = 110 * k; ly += 120 * k; }
    const its = items.filter(it => it.sector === key);
    g.fillStyle = s.cor; g.beginPath(); g.arc(lx + 28 * k, ly - 15 * k, 28 * k, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = 4 * k; g.stroke();
    g.fillStyle = '#f4f1e8';
    g.fillText(`${s.nome.replace('Setor ', '')}  ${its[0].label}–${its.at(-1).label}`, lx + 76 * k, ly);
    lx += 905 * k;
  });
  return c;
}
$('ePlan').onclick = () => buildPlanCanvas().toBlob(b => download(b, 'reveillon2027_planta_numerada.png'));
$('eView').onclick = () => {
  const cam = camera.clone(); cam.aspect = 16 / 9; cam.updateProjectionMatrix();
  const prevPulse = pulseRing.visible; pulseRing.visible = false;
  renderToCanvas(cam, 3840, 2160).toBlob(b => download(b, 'reveillon2027_vista.png'));
  pulseRing.visible = prevPulse;
};
window.__mapa = { buildPlanCanvas, renderToCanvas, camera, controls, VIEWS, flyTo, THREE, items, select };

// ---------- loop ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function loop(now) {
  if (anim) {
    const k = Math.min(1, (now - anim.t0) / anim.ms), e = ease(k);
    controls.target.lerpVectors(anim.ft, anim.tt, e);
    camera.position.lerpVectors(anim.fp, anim.tp, e);
    if (k >= 1) anim = null;
  }
  if (pulseRing.visible) pulseRing.material.opacity = 0.55 + 0.45 * Math.sin(now / 180);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
document.fonts.load('800 100px Montserrat').finally(() => { refreshAll(); window.__ready = true; requestAnimationFrame(loop); });
</script>
</body>
</html>
